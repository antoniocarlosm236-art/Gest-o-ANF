<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Serviços</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GestãoServiços">
<link rel="apple-touch-icon" href="logo-anf.png">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: { 50: '#f0f4f9', 100: '#e1e9f3', 500: '#1f4e8c', 600: '#183f73', 700: '#122f57' },

        }

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f8;--cd:#fff;--tx:#16202e;--mu:#637083;--ln:#e2e7ee;--c1:#1f4e8c;--on1:#fff;--c2:#f28c28;--ok:#16895a;--wa:#b45309;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--cd:#18202b;--tx:#e8edf3;--mu:#97a3b4;--ln:#2a3443;--ok:#3ecf8e;--wa:#f5a524;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--cd:#18202b;--tx:#e8edf3;--mu:#97a3b4;--ln:#2a3443;--ok:#3ecf8e;--wa:#f5a524;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{background:var(--c1);color:var(--on1);padding:14px 20px 0}
.hd{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.hd img{max-height:48px;max-width:150px;object-fit:contain;background:#fff;padding:4px 8px;border-radius:8px}
.hd h1{font-size:17px;font-weight:800;margin:0;flex:1;min-width:140px}
.usr-pill{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
nav{display:flex;gap:4px;max-width:1100px;margin:10px auto 0;overflow-x:auto}
nav button{background:none;border:0;color:inherit;opacity:.75;font-family:inherit;font-weight:600;font-size:14px;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{opacity:1;border-color:var(--on1)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--tx)}
.tb select,.tb input{width:auto}
input[type=color]{padding:2px;height:40px}
.bt{background:var(--c1);color:var(--on1);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.g{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
.g.red{background:#b42318;color:#fff;border-color:#b42318}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.k{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:14px}
.k span,.k small{color:var(--mu);font-size:13px}
.k b{display:block;font-size:22px;font-weight:800;margin:2px 0}
.k.hero{grid-column:span 2;background:var(--c1);border-color:var(--c1);color:var(--on1)}
.k.hero span,.k.hero small{color:inherit;opacity:.85}
.k.hero b{font-size:34px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px}
.gr .cd{margin:0}
.cd h3{margin:0 0 10px;font-size:15px}
.cv{position:relative;height:250px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mu);font-weight:600;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
td small{display:block;color:var(--mu)}
.n{text-align:right;white-space:nowrap}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--ln);white-space:nowrap}
.b.t{background:var(--c1);color:var(--on1);border-color:var(--c1)}
.b.ok{color:var(--ok);border-color:var(--ok)}
.b.wa{color:var(--wa);border-color:var(--wa)}
.b.er{color:#e5484d;border-color:#e5484d}
.mu{color:var(--mu)}
.em{padding:24px;text-align:center;color:var(--mu)}
dialog{border:0;border-radius:14px;padding:20px;width:min(640px,95vw);max-height:90vh;background:var(--cd);color:var(--tx)}
dialog::backdrop{background:#0008}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:block;font-size:13px;color:var(--mu)}
.f .w{grid-column:1/-1}
.f label.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}
.ck input{width:auto}
.ac{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:9}
@media(max-width:560px){.k.hero{grid-column:1/-1}.f{grid-template-columns:1fr}}
.sn{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.sn .g{padding:8px 16px;font-weight:600}.sn .g.on{background:var(--c1);color:var(--on1);border-color:var(--c1)}
.sm div{display:flex;justify-content:space-between;padding:3px 0}.sm .tt{border-top:1px solid var(--ln);margin-top:4px;padding-top:8px;font-size:18px;font-weight:800}
.wz{display:inline-block;background:#168a44;color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;text-decoration:none}
.rt{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;margin:12px 0 0;padding:10px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;font-size:13px;line-height:1.5;font-family:inherit}
.orc-item{border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}
#login-gate{position:fixed;inset:0;background:rgba(15,20,27,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:999}
.login-box{background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:16px;padding:24px;width:min(400px,100%);box-shadow:0 20px 40px rgba(0,0,0,.35)}
.quick-users{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
</style>
</head>
<body>
<!-- Tela de Login Simples (Identificação de Usuário) -->
<div id="login-gate">
  <div class="login-box">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <img src="logo-anf.png" alt="ANF" style="height:42px;object-fit:contain;background:#fff;padding:3px 6px;border-radius:6px" onerror="this.style.display='none'">
      <div>
        <h2 style="margin:0;font-size:17px;font-weight:800">ANF Instalações Elétricas</h2>
        <span style="font-size:12px;color:var(--mu)">Identificação rápida para registros</span>
      </div>
    </div>
    <p style="font-size:13px;color:var(--mu);margin:0 0 12px">Digite seu nome para sabermos quem está lançando os serviços, custos, horas e orçamentos:</p>
    <form onsubmit="confirmarUsuario(event)">
      <input id="inp-usuario-login" type="text" placeholder="Ex: Antônio, Ariany..." required autocomplete="name">
      <div id="lista-usuarios-salvos" class="quick-users"></div>
      <button type="submit" class="bt" style="width:100%;margin-top:14px">Entrar no Sistema</button>
    </form>
  </div>
</div>

<header>
  <div class="hd">
    <img id="lg" alt="Logo ANF" hidden>
    <h1 id="nm">Gestão de Serviços</h1>
    <button id="btn-user-badge" onclick="abrirTrocaUsuario()" title="Trocar usuário" class="usr-pill">👤 Usuário</button>
    <button onclick="pedirPermissaoNotif()" title="Ativar notificações de cobrança" class="g" style="border:0;color:#fff;opacity:0.9">🔔</button>
    <button onclick="init()" title="Sincronizar com a planilha" class="g" style="border:0;color:#fff;opacity:0.9">🔄</button>
    <button onclick="toggleTheme()" class="g" style="border:0;color:#fff;opacity:0.9">🌓</button>
  </div>
  <nav id="nv"></nav>
</header>
<main id="mn"></main>
<dialog id="dl"></dialog>
<div id="ts" role="status"></div>

<!-- Banner de Instalação PWA -->
<div id="pwa-install-banner" class="hidden fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-xl shadow-2xl z-50 flex items-center justify-between">
  <div>
    <h4 class="font-bold text-sm">Instalar Aplicativo</h4>
    <p class="text-xs text-slate-500">Adicione à tela inicial para usar como app nativo.</p>
  </div>
  <button id="btn-install" class="bt text-xs px-3 py-2">Instalar</button>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx_LAR8iqNZO_dj2F80SFsqZtbRLgGjIOOzLK0zd769Bea2fNl9zMnJxfAgz0EOZLJh/exec';
const CACHE_KEY = 'gestao-anf-cache-v1';
const USER_KEY = 'gestao-anf-usuario-atual';
const USERS_HIST_KEY = 'gestao-anf-usuarios-lista';

const $=s=>document.querySelector(s),
R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),
N=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:1}),
esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0),
normD=d=>{if(!d)return'';const s=String(d).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);if(/^\d{2}\/\d{2}\/\d{4}/.test(s))return s.slice(6,10)+'-'+s.slice(3,5)+'-'+s.slice(0,2);return s.slice(0,10)},
addMonths=(d,m)=>{const base=normD(d)||hoje();const p=base.split('-');let y=+p[0],mo=+p[1]-1+m,day=+p[2];y+=Math.floor(mo/12);mo=((mo%12)+12)%12;const maxD=new Date(y,mo+1,0).getDate();if(day>maxD)day=maxD;return `${y}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;},
normT=t=>{if(!t)return'';const s=String(t).trim();const m=s.match(/(\d{1,2}):(\d{2})/);return m?m[1].padStart(2,'0')+':'+m[2]:''},
fd=d=>{const x=normD(d);return x?x.split('-').reverse().join('/'):''},
hoje=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},
css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim(),
on=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>150?'#101828':'#fff'},
ORI=['Indicação','Google Ads','Panfleto','Instagram/Facebook','WhatsApp','Empresa parceira','Já era cliente','Outro'],
CAT=['Alimentação','Transporte/Combustível','Google Ads','Panfletos','Material','Ferramentas','Impostos/Taxas','Outros'],
STS=['Orçamento','Agendado','Concluído'],TIP=['Cliente final','Terceirizado'],FP=['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','Boleto','Cheque','Outro'],
PARC=['1x','2x','3x','4x','5x','6x','8x','10x','12x'],
MAPA={'Google Ads':'Google Ads','Panfleto':'Panfletos'},
pal=['#1f4e8c','#f28c28','#16895a','#8b5cf6','#e11d48','#0ea5e9','#a3a3a3','#eab308','#14b8a6'];

let usuarioAtual = localStorage.getItem(USER_KEY) || '';
let S={cfg:{nome:'ANF Instalações Elétricas',c1:'#1f2328',c2:'#656565',kmv:0,logo:'logo-anf.png'},s:{},c:{},o:{}},tab='dash',per='all',ft='',q='',col=null,ch=[],ed=null,armed=0;
let H={c:[],e:[]},hv='lan',hid=null,hcid=null,HF={},HT='',HW='';
let orcItens=[];

// === LOGIN SIMPLES / IDENTIFICAÇÃO DE USUÁRIO ===
function getUsuariosHistorico(){
  try{
    const arr = JSON.parse(localStorage.getItem(USERS_HIST_KEY)) || [];
    const base = ['Antônio', 'Ariany', ...arr];
    return [...new Set(base.map(x=>String(x).trim()).filter(Boolean))];
  }catch(e){ return ['Antônio', 'Ariany']; }
}

function salvarUsuarioHistorico(nome){
  try{
    const lista = getUsuariosHistorico();
    if(!lista.includes(nome)) lista.push(nome);
    localStorage.setItem(USERS_HIST_KEY, JSON.stringify(lista));
  }catch(e){}
}

function atualizarBadgeUsuario(){
  const b = $('#btn-user-badge');
  if(b) b.textContent = usuarioAtual ? `👤 ${usuarioAtual}` : '👤 Entrar';
}

function verificarLogin(){
  atualizarBadgeUsuario();
  if(!usuarioAtual){
    abrirTrocaUsuario();
  }
}

function abrirTrocaUsuario(){
  const gate = $('#login-gate');
  const inp = $('#inp-usuario-login');
  const box = $('#lista-usuarios-salvos');
  if(!gate) return;
  inp.value = usuarioAtual || '';
  const nomes = getUsuariosHistorico();
  box.innerHTML = nomes.map(n => `<button type="button" class="g" style="padding:4px 10px;font-size:12px" onclick="$('#inp-usuario-login').value='${esc(n)}'">${esc(n)}</button>`).join('');
  gate.style.display = 'flex';
  setTimeout(()=>inp.focus(), 50);
}

function confirmarUsuario(ev){
  if(ev) ev.preventDefault();
  const nome = ($('#inp-usuario-login').value || '').trim();
  if(!nome) return;
  usuarioAtual = nome;
  localStorage.setItem(USER_KEY, nome);
  salvarUsuarioHistorico(nome);
  atualizarBadgeUsuario();
  $('#login-gate').style.display = 'none';
  toast(`Bem-vindo(a), ${nome}!`);
}

function saveCache(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({s:S.s,c:S.c,o:S.o,hc:H.c,he:H.e}))}catch(e){}
}
function loadCache(){
  try{
    const j=JSON.parse(localStorage.getItem(CACHE_KEY));
    if(j){if(j.s)S.s=j.s;if(j.c)S.c=j.c;if(j.o)S.o=j.o;if(j.hc)H.c=j.hc;if(j.he)H.e=j.he;}
  }catch(e){}
}
loadCache();

const isPaid=v=>v===true||v==='TRUE'||v==='true'||v===1||v==='1';
const inP=d=>{const x=normD(d);return per==='all'||(x&&x.slice(0,7)===per)},
SV=()=>Object.entries(S.s).map(([id,x])=>({...x,id,data:normD(x.data),prazo:normD(x.prazo),pago:isPaid(x.pago),parcelas:+x.parcelas||1})).filter(x=>inP(x.data)),
CU=()=>Object.entries(S.c).map(([id,x])=>({...x,id,data:normD(x.data),prazo:normD(x.prazo),pago:isPaid(x.pago),parcelas:+x.parcelas||1})).filter(x=>inP(x.data)),
HO=()=>H.e.map(x=>({...x,d:normD(x.d),prazo:normD(x.prazo),pago:isPaid(x.pago),forma:x.forma||'',parcelas:+x.parcelas||1,i:normT(x.i),o:normT(x.o),vh:+x.vh||0,km:+x.km||0,vk:+x.vk||0})).filter(x=>inP(x.d)),
pg=x=>{
  const p=+x.parcelas||1;
  const pInfo=p>1?`<small>${p}x de ${R((+x.valor||0)/p)}</small>`:'';
  if(x.pago)return`<span class="b ok">Pago</span>${x.forma?`<small>${esc(x.forma)}</small>`:''}${pInfo}`;
  if(x.prazo)return(x.prazo<hoje()?`<span class="b er">Atrasado desde ${fd(x.prazo)}</span>`:`<span class="b wa">Prev. ${fd(x.prazo)}</span>`)+(x.forma?`<small>${esc(x.forma)}</small>`:'')+pInfo;
  return`<span class="b wa">A receber</span>${x.forma?`<small>${esc(x.forma)}</small>`:''}${pInfo}`;
},
pgCusto=x=>{
  const p=+x.parcelas||1;
  const pInfo=p>1?`<small>${p}x de ${R((+x.valor||0)/p)}</small>`:'';
  if(x.pago)return`<span class="b ok">Pago</span>${x.forma?`<small>${esc(x.forma)}</small>`:''}${pInfo}`;
  if(x.prazo)return(x.prazo<hoje()?`<span class="b er">Vencido ${fd(x.prazo)}</span>`:`<span class="b wa">A pagar ${fd(x.prazo)}</span>`)+(x.forma?`<small>${esc(x.forma)}</small>`:'')+pInfo;
  return`<span class="b wa">A pagar</span>${x.forma?`<small>${esc(x.forma)}</small>`:''}${pInfo}`;
},
kpi=(a,b,c)=>`<div class=k><span>${a}</span><b>${b}</b><small>${c}</small></div>`,
tr=(...c)=>`<tr>${c.map((x,i)=>`<td${i?' class=n':''}>${x}`).join('')}</tr>`,
tbl=(h,r,e)=>r.length?`<div class=tw><table><tr>${h.map((x,i)=>`<th${i?' class=n':''}>${x}`).join('')}</tr>${r.join('')}</table></div>`:`<p class=em>${e}</p>`,
fld=(l,id,v,t='text',w)=>`<label${w?' class=w':''}>${l}<input id=${id} type=${t} value="${esc(v)}"${t==='number'?' step=0.01 min=0 inputmode=decimal':''}></label>`,
sel=(l,id,o,v,w)=>`<label${w?' class=w':''}>${l}<select id=${id}>${o.map(x=>`<option${x===v?' selected':''}>${x}`).join('')}</select></label>`;

function toast(m){const t=$('#ts');if(!t)return;t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',3500)}

// === SISTEMA DE NOTIFICAÇÕES NATIVAS E ALERTAS ===
async function pedirPermissaoNotif(){
  if(!('Notification' in window)) return toast('Este navegador não suporta notificações nativas.');
  const perm = await Notification.requestPermission();
  if(perm === 'granted'){
    toast('Notificações ativadas!');
    dispararNotificacaoNativa(true);
  } else {
    toast('Permissão de notificação negada no navegador.');
  }
}

async function dispararNotificacaoNativa(forcarTeste=false){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const alertas = getVencimentosHojeOuAtraso();
  if(!alertas.length && !forcarTeste) return;

  const keyHoje = 'notif-enviada-' + hoje();
  if(!forcarTeste && localStorage.getItem(keyHoje) === String(alertas.length)) return;
  localStorage.setItem(keyHoje, String(alertas.length));

  const titulo = alertas.length
    ? `ANF Gestão: ${alertas.length} recebimento(s) para conferir`
    : 'ANF Gestão: Notificações ativas!';
  const corpo = alertas.length
    ? alertas.map(a => `${a.nome}: ${R(a.valor)} (${a.prazo < hoje() ? 'Atrasado' : 'Hoje'})`).join(' | ')
    : 'Você será avisado aqui e por e-mail nos dias de recebimento.';

  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if(reg && reg.showNotification){
      await reg.showNotification(titulo, {
        body: corpo,
        icon: 'logo-anf.png',
        badge: 'logo-anf.png',
        tag: 'anf-cobranca',
        data: { url: './' }
      });
    } else {
      new Notification(titulo, { body: corpo, icon: 'logo-anf.png' });
    }
  } catch(e){}
}

function getVencimentosHojeOuAtraso() {
  const hojeStr = hoje();
  const alertas = [];

  Object.entries(S.s).forEach(([id, x]) => {
    const pago = isPaid(x.pago);
    const prazo = normD(x.prazo);
    const st = x.situacao || x.st;
    if (!pago && st === STS[2] && prazo && prazo <= hojeStr) {
      alertas.push({
        kind: 'srv',
        id,
        nome: (x.cliente || x.cli || 'Cliente').trim(),
        desc: (x.servico || x.srv || 'Serviço').trim(),
        prazo,
        valor: +x.valor || 0,
        fone: ''
      });
    }
  });

  H.e.forEach(e => {
    const pago = isPaid(e.pago);
    const prazo = normD(e.prazo);
    if (!pago && prazo && prazo <= hojeStr) {
      const emp = hco(e.c);
      const calcH = hcalc({...e, d: normD(e.d), i: normT(e.i), o: normT(e.o), vh: +e.vh || 0, km: +e.km || 0, vk: +e.vk || 0});
      alertas.push({
        kind: 'hor',
        id: e.id,
        nome: emp ? emp.n : 'Empresa',
        contato: emp ? emp.ct : '',
        fone: emp ? emp.z : '',
        desc: 'Horas (' + fd(e.d) + ')',
        prazo,
        valor: calcH.t
      });
    }
  });

  return alertas.sort((a, b) => a.prazo.localeCompare(b.prazo));
}

function linkCobrancaWhats(item) {
  const saudacao = item.contato ? `Olá, ${item.contato}!` : 'Olá!';
  const statusPrazo = item.prazo < hoje() ? `com previsão em ${fd(item.prazo)}` : `previsto para hoje (${fd(item.prazo)})`;
  const msg = `${saudacao} Passando para alinhar o pagamento referente a *${item.desc}* (${item.nome}), no valor de *${R(item.valor)}*, ${statusPrazo}. Consegue nos confirmar o status por favor?`;
  let z = (item.fone || '').replace(/[^0-9]/g, '').replace(/^0+/, '');

  return z

}

async function marcarComoPago(kind, id) {
  const formaPadrao = prompt('Foi pago! Informe o meio de pagamento (Pix, Dinheiro, Transferência, Cartão...):', 'Pix');
  if (formaPadrao === null) return;
  if (kind === 'srv' && S.s[id]) {
    const item = {...S.s[id], pago: true, forma: formaPadrao.trim() || S.s[id].forma || '', usuario: usuarioAtual || S.s[id].usuario || ''};
    await put('s', id, item);
  } else if (kind === 'hor') {
    const idx = H.e.findIndex(x => String(x.id) === String(id));
    if (idx >= 0) {
      const item = {...H.e[idx], pago: true, forma: formaPadrao.trim() || H.e[idx].forma || '', usuario: usuarioAtual || H.e[idx].usuario || ''};
      await put('h', id, item);
    }
  }
}

async function syncPost(sheet, action, data) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ sheet, action, data })
  });
  return res.json();
}

async function put(sheet, id, data) {
  const payload = { ...data, usuario: data.usuario || usuarioAtual || 'Não informado' };
  if(sheet === 's') S.s[id] = payload;
  else if(sheet === 'c') S.c[id] = payload;
  else if(sheet === 'o') S.o[id] = payload;
  else if(sheet === 'h') {
    const idx = H.e.findIndex(x => String(x.id) === String(id));
    if(idx >= 0) H.e[idx] = payload; else H.e.push(payload);
  }
  else if(sheet === 'comp') {
    const idx = H.c.findIndex(x => String(x.id) === String(id));
    if(idx >= 0) H.c[idx] = payload; else H.c.push(payload);
  }
  saveCache();
  render();
  const targetSheet = sheet === 's' ? 'Servicos' : sheet === 'c' ? 'Custos' : sheet === 'o' ? 'Orcamentos' : sheet === 'h' ? 'Horas' : 'Empresas';
  toast('Salvando na planilha...');
  try {
    const r = await syncPost(targetSheet, 'save', { id, ...payload });
    if(r && r.status === 'success') toast('Sincronizado com sucesso!');
    else toast('Salvo localmente (verifique a aba '+targetSheet+').');
  } catch(e) {
    toast('Salvo localmente (erro de rede).');
  }
}

async function rm(sheet, id) {
  if(sheet === 'sc') {
    delete S.s[id]; delete S.c[id]; saveCache(); render();
    try { await syncPost('Servicos', 'delete', {id}); await syncPost('Custos', 'delete', {id}); } catch(e){}
  }
  else if(sheet === 'c') {
    delete S.c[id]; saveCache(); render();
    try { await syncPost('Custos', 'delete', {id}); } catch(e){}
  }
  else if(sheet === 'o') {
    delete S.o[id]; saveCache(); render();
    try { await syncPost('Orcamentos', 'delete', {id}); } catch(e){}
  }
  else if(sheet === 'h') {
    H.e = H.e.filter(e => String(e.id) !== String(id)); saveCache(); render();
    try { await syncPost('Horas', 'delete', {id}); } catch(e){}
  }
  else if(sheet === 'comp') {
    H.c = H.c.filter(c => String(c.id) !== String(id)); saveCache(); render();
    try { await syncPost('Empresas', 'delete', {id}); } catch(e){}
  }
  toast('Excluído.');
}

function getParcelasReceber(){
  const linhas=[];
  const sv=SV().filter(x=>(x.situacao||x.st)===STS[2]&&!x.pago);
  sv.forEach(x=>{
    const p=+x.parcelas||1;
    const tot=+x.valor||0;
    const base=x.prazo||x.data||hoje();
    if(p>1){
      const vp=r2(tot/p);
      for(let i=0;i<p;i++){
        linhas.push({nome:(x.cliente||x.cli||'Cliente')+' (Serv.)',parc:`${i+1}/${p} • ${x.forma||'Cartão'}`,prazo:addMonths(base,i),valor:vp,pago:false});
      }
    }else{
      linhas.push({nome:(x.cliente||x.cli||'Cliente')+' (Serv.)',parc:x.forma||'À vista',prazo:x.prazo||'',valor:tot,pago:false});
    }
  });
  HO().filter(e=>!e.pago).forEach(e=>{
    const emp=hco(e.c);
    const nome=(emp?emp.n:'Empresa')+' (Horas)';
    const tot=hcalc(e).t;
    const p=+e.parcelas||1;
    const base=e.prazo||e.d||hoje();
    if(p>1){
      const vp=r2(tot/p);
      for(let i=0;i<p;i++){
        linhas.push({nome,parc:`${i+1}/${p} • ${e.forma||'Cartão'}`,prazo:addMonths(base,i),valor:vp,pago:false});
      }
    }else{
      linhas.push({nome,parc:e.forma||'A combinar',prazo:e.prazo||'',valor:tot,pago:false});
    }
  });
  return linhas.sort((a,b)=>(a.prazo||'9').localeCompare(b.prazo||'9'));
}

function getParcelasAPagar(){
  const linhas=[];
  CU().filter(x=>!x.pago).forEach(x=>{
    const p=+x.parcelas||1;
    const tot=+x.valor||0;
    const base=x.prazo||x.data||hoje();
    if(p>1){
      const vp=r2(tot/p);
      for(let i=0;i<p;i++){
        linhas.push({nome:(x.descricao||x.desc||x.cat||'Custo'),parc:`${i+1}/${p} • ${x.forma||'Cartão'}`,prazo:addMonths(base,i),valor:vp});
      }
    }else{
      linhas.push({nome:(x.descricao||x.desc||x.cat||'Custo'),parc:x.forma||'À vista',prazo:x.prazo||'',valor:tot});
    }
  });
  return linhas.sort((a,b)=>(a.prazo||'9').localeCompare(b.prazo||'9'));
}

function nextOrcNum(){
  const ano = new Date().getFullYear();
  const nums = Object.values(S.o).map(x => parseInt(String(x.numero||'').split('-')[0], 10)).filter(n => !isNaN(n));
  const prox = (nums.length ? Math.max(...nums) : 0) + 1;
  return String(prox).padStart(3, '0') + '-' + ano;
}

function parseOrcItens(raw){
  if(Array.isArray(raw)) return raw;
  try{ const j = JSON.parse(raw); if(Array.isArray(j)) return j; }catch(e){}
  return [{titulo:'Execução de Projeto / Serviço', desc:'', un:'', preco:0, qtd:1}];
}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">

        <label class=w>Quantidade (deixe 1 para valor fechado)<input type=number step=0.01 min=0 value="${esc(it.qtd||1)}" oninput="orcItens[${idx}].qtd=+this.value||0;updOrcTotal()"></label>

  updOrcTotal();
}

function addOrcItem(){
  orcItens.push({titulo:'Logística', desc:'Logística completa incluindo translado, alimentação, etc.', un:'un.', preco:0, qtd:1});
  renderOrcItensEditor();
}

function remOrcItem(idx){
  orcItens.splice(idx, 1);
  renderOrcItensEditor();
}

function updOrcTotal(){
  const tot = orcItens.reduce((s, it) => s + r2((+it.preco||0) * (+it.qtd||1)), 0);
  if($('#orc_tot_lbl')) $('#orc_tot_lbl').textContent = R(tot);
}

async function saveO(){
  const cli = $('#o_cli').value.trim();
  if(!cli) return toast('Informe o nome do cliente.');
  const id = ed || 'o' + Date.now().toString(36);
  const total = orcItens.reduce((s, it) => s + r2((+it.preco||0) * (+it.qtd||1)), 0);
  const d = {
    id,
    numero: $('#o_num').value.trim() || nextOrcNum(),
    data: $('#o_data').value || hoje(),
    titulo: $('#o_tit').value.trim(),
    cliente: cli,
    razao: $('#o_raz').value.trim(),
    cnpj: $('#o_cnpj').value.trim(),
    endereco: $('#o_end').value.trim(),
    email: $('#o_eml').value.trim(),

async function aprovarOrc(id){
  const o = S.o[id];
  if(!o) return;
  const sid = 's' + Date.now().toString(36);
  const srv = {
    id: sid,
    data: hoje(),
    tipo: TIP[0],
    cliente: o.cliente,
    servico: (o.titulo ? o.titulo + ' - ' : '') + 'Orçamento ' + (o.numero||''),
    origem: 'Outro',
    km: 0,
    valor: +o.total || 0,
    situacao: STS[1],
    pago: false,

    usuario: usuarioAtual
  };
  await put('s', sid, srv);
  toast('Orçamento convertido em Serviço Agendado!');
  tab = 'srv';
  render();

function whatsOrc(o){
  const itens = parseOrcItens(o.itens);
  const linhasItens = itens.map(it => {
    const q = +it.qtd || 1;
    const sub = r2((+it.preco||0) * q);
    return `• ${it.titulo}${q>1?' ('+q+' '+(it.un||'un.')+')':''}: ${R(sub)}`;
  }).join(NL);
  const msg = `*ANF Instalações Elétricas*${NL}*Orçamento ${o.numero||''}${o.titulo?' - '+o.titulo:''}*${NL}Cliente: ${o.cliente||''}${NL}Prazo de execução: ${o.prazo||'A combinar'}${NL}${NL}${linhasItens}${NL}${NL}*Total: ${R(o.total)}*${NL}${NL}Chave PIX (CNPJ/CPF): 857.201.860-34${NL}Banco Santander | Ag: 1464 | C/C: 01008516-6`;
  let z = (o.fone || '').replace(/[^0-9]/g,'').replace(/^0+/,'');
  if(z && z.length <= 11) z = '55' + z;
  return z ? `https://wa.me/${z}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
}

function bodyS(){const a=rowsS();return a.length?`<p class=mu>${a.length} serviços, ${R(sum(a,'valor'))} cobrados, ${N(sum(a,'km'))} km</p><div class=tw><table><tr><th>Data<th>Cliente<th>Tipo<th>Origem<th class=n>Km<th class=n>Valor<th>Situação<th></tr>${a.map(x=>`<tr><td>${fd(x.data)}${x.usuario?`<small>Por: ${esc(x.usuario)}</small>`:''}<td>${esc(x.cliente||x.cli)}<small>${esc(x.servico||x.srv)}</small><td><span class="b${x.tipo===TIP[1]?' t':''}">${x.tipo}</span><td>${x.origem||x.ori}<td class=n>${N(x.km)} km<td class=n>${R(x.valor)}<td>${x.situacao||x.st}${((x.situacao||x.st)===STS[2])?pg(x):''}<td><button class=g onclick="openS('${x.id}')">Editar</button></tr>`).join('')}</table></div>`:'<p class=em>Nenhum serviço encontrado.</p>'}
function lsS(){return `<div class=cd><div class=tb><input style="flex:1;min-width:160px" placeholder="Buscar..." value="${esc(q)}" oninput="q=this.value;$('#ls').innerHTML=bodyS()"><select onchange="ft=this.value;$('#ls').innerHTML=bodyS()"><option value="">Todos os tipos${TIP.map(t=>`<option${ft===t?' selected':''}>${t}`).join('')}</select></div><div id=ls>${bodyS()}</div></div>`}

 const pPago=sum(a.filter(x=>x.pago),'valor'),pAPagar=sum(a.filter(x=>!x.pago),'valor');
 return `<div class=cd><p class=mu>${a.length} lançamentos • Total: ${R(sum(a,'valor'))} • Pago: ${R(pPago)} • A pagar: ${R(pAPagar)}</p>`+(a.length?`<div class=tw><table><tr><th>Data<th>Categoria / Descrição<th>Pagamento<th class=n>Valor<th></tr>${a.map(x=>`<tr><td>${fd(x.data)}${x.usuario?`<small>Por: ${esc(x.usuario)}</small>`:''}<td>${esc(x.cat)}<small>${esc(x.descricao||x.desc||'')}</small><td>${pgCusto(x)}<td class=n>${R(x.valor)}<td><button class=g onclick="openC('${x.id}')">Editar</button></tr>`).join('')}</table></div>`:'<p class=em>Nenhum custo.</p>')+'</div>'}

async function pushAllToCloud() {
  toast('Enviando tudo para a planilha...');
  let count = 0;
  for (const [id, item] of Object.entries(S.s)) { await syncPost('Servicos', 'save', { id, ...item }); count++; }
  for (const [id, item] of Object.entries(S.c)) { await syncPost('Custos', 'save', { id, ...item }); count++; }
  for (const [id, item] of Object.entries(S.o)) { await syncPost('Orcamentos', 'save', { id, ...item }); count++; }
  for (const item of H.c) { await syncPost('Empresas', 'save', item); count++; }
  for (const item of H.e) { await syncPost('Horas', 'save', item); count++; }
  toast(`${count} registros enviados para a planilha!`);
}
