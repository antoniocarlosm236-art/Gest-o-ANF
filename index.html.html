<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Serviços</title>
<!-- PWA Manifest & Meta Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GestãoServiços">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: { 50: '#f0f4f9', 100: '#e1e9f3', 500: '#1f4e8c', 600: '#183f73', 700: '#122f57' },
          accent: { 500: '#f28c28', 600: '#d9771e' }
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f8;--cd:#fff;--tx:#16202e;--mu:#637083;--ln:#e2e7ee;--c1:#1f4e8c;--on1:#fff;--c2:#f28c28;--ok:#16895a;--wa:#b45309;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--cd:#18202b;--tx:#e8edf3;--mu:#97a3b4;--ln:#2a3443;--ok:#3ecf8e;--wa:#f5a524;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--cd:#18202b;--tx:#e8edf3;--mu:#97a3b4;--ln:#2a3443;--ok:#3ecf8e;--wa:#f5a524;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{background:var(--c1);color:var(--on1);padding:14px 20px 0}
.hd{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.hd img{max-height:52px;max-width:160px;object-fit:contain;background:#fff;padding:4px 10px;border-radius:8px}
.hd h1{font-size:18px;font-weight:800;margin:0;flex:1}
nav{display:flex;gap:4px;max-width:1100px;margin:10px auto 0;overflow-x:auto}
nav button{background:none;border:0;color:inherit;opacity:.75;font-family:inherit;font-weight:600;font-size:14px;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{opacity:1;border-color:var(--on1)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
input,select,textarea,button{font:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--tx)}
.tb select,.tb input{width:auto}
input[type=color]{padding:2px;height:40px}
.bt{background:var(--c1);color:var(--on1);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.g{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
.g.red{background:#b42318;color:#fff;border-color:#b42318}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.k{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:14px}
.k span,.k small{color:var(--mu);font-size:13px}
.k b{display:block;font-size:22px;font-weight:800;margin:2px 0}
.k.hero{grid-column:span 2;background:var(--c1);border-color:var(--c1);color:var(--on1)}
.k.hero span,.k.hero small{color:inherit;opacity:.85}
.k.hero b{font-size:34px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px}
.gr .cd{margin:0}
.cd h3{margin:0 0 10px;font-size:15px}
.cv{position:relative;height:250px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mu);font-weight:600;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
td small{display:block;color:var(--mu)}
.n{text-align:right;white-space:nowrap}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--ln);white-space:nowrap}
.b.t{background:var(--c1);color:var(--on1);border-color:var(--c1)}
.b.ok{color:var(--ok);border-color:var(--ok)}
.b.wa{color:var(--wa);border-color:var(--wa)}
.b.er{color:#e5484d;border-color:#e5484d}
.mu{color:var(--mu)}
.em{padding:24px;text-align:center;color:var(--mu)}
dialog{border:0;border-radius:14px;padding:20px;width:min(500px,94vw);max-height:90vh;background:var(--cd);color:var(--tx)}
dialog::backdrop{background:#0008}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:block;font-size:13px;color:var(--mu)}
.f .w{grid-column:1/-1}
.f label.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}
.ck input{width:auto}
.ac{display:flex;gap:8px;margin-top:16px}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:9}
@media(max-width:560px){.k.hero{grid-column:1/-1}.f{grid-template-columns:1fr}}
.sn{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.sn .g{padding:8px 16px;font-weight:600}.sn .g.on{background:var(--c1);color:var(--on1);border-color:var(--c1)}
.sm div{display:flex;justify-content:space-between;padding:3px 0}.sm .tt{border-top:1px solid var(--ln);margin-top:4px;padding-top:8px;font-size:18px;font-weight:800}
.wz{display:inline-block;background:#168a44;color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;text-decoration:none}
.rt{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;margin:12px 0 0;padding:10px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;font-size:13px;line-height:1.5;font-family:inherit}
</style>
</head>
<body>
<header>
  <div class="hd">
    <img id="lg" alt="Logo" hidden>
    <h1 id="nm">Gestão de Serviços</h1>
    <button onclick="toggleTheme()" class="g" style="border:0;color:#fff;opacity:0.9">🌓</button>
  </div>
  <nav id="nv"></nav>
</header>
<main id="mn"></main>
<dialog id="dl"></dialog>
<div id="ts" role="status"></div>

<!-- Banner de Instalação PWA -->
<div id="pwa-install-banner" class="hidden fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-xl shadow-2xl z-50 flex items-center justify-between">
  <div>
    <h4 class="font-bold text-sm">Instalar Aplicativo</h4>
    <p class="text-xs text-slate-500">Adicione à tela inicial para usar como app nativo.</p>
  </div>
  <button id="btn-install" class="bt text-xs px-3 py-2">Instalar</button>
</div>

<script>
// URL do Google Apps Script Vinculada
const API_URL = 'https://script.google.com/macros/s/AKfycbwurnt0Cd_PA97auxIp4nbwGG97dhVWoyi_LMIQs4WUW1JxkJCUgORowyZ9fyPFyruo/exec';

const $=s=>document.querySelector(s),
R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),
N=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:1}),
esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0),
fd=d=>d?String(d).split('T')[0].split('-').reverse().join('/'):'',
hoje=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},
css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim(),
on=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>150?'#101828':'#fff'},
ORI=['Indicação','Google Ads','Panfleto','Instagram/Facebook','WhatsApp','Empresa parceira','Já era cliente','Outro'],
CAT=['Alimentação','Transporte/Combustível','Google Ads','Panfletos','Material','Ferramentas','Impostos/Taxas','Outros'],
STS=['Orçamento','Agendado','Concluído'],TIP=['Cliente final','Terceirizado'],FP=['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','Boleto','Cheque','Outro'],
MAPA={'Google Ads':'Google Ads','Panfleto':'Panfletos'},
pal=['#1f4e8c','#f28c28','#16895a','#8b5cf6','#e11d48','#0ea5e9','#a3a3a3','#eab308','#14b8a6'];

let S={cfg:{nome:'ANF Instalações Elétricas',c1:'#1f2328',c2:'#656565',kmv:0,logo:''},s:{},c:{}},tab='dash',per='all',ft='',q='',col=null,ch=[],ed=null,armed=0;

const inP=d=>per==='all'||(d&&d.slice(0,7)===per),
SV=()=>Object.entries(S.s).map(([id,x])=>({...x,id})).filter(x=>inP(x.data)),
CU=()=>Object.entries(S.c).map(([id,x])=>({...x,id})).filter(x=>inP(x.data)),
pg=x=>x.pago?`<span class="b ok">Pago</span>${x.forma?`<small>${x.forma}</small>`:''}`:x.prazo?(x.prazo<hoje()?`<span class="b er">Atrasado desde ${fd(x.prazo)}</span>`:`<span class="b wa">Pagar até ${fd(x.prazo)}</span>`):'<span class="b wa">A receber</span>',
kpi=(a,b,c)=>`<div class=k><span>${a}</span><b>${b}</b><small>${c}</small></div>`,
tr=(...c)=>`<tr>${c.map((x,i)=>`<td${i?' class=n':''}>${x}`).join('')}</tr>`,
tbl=(h,r,e)=>r.length?`<div class=tw><table><tr>${h.map((x,i)=>`<th${i?' class=n':''}>${x}`).join('')}</tr>${r.join('')}</table></div>`:`<p class=em>${e}</p>`,
fld=(l,id,v,t='text',w)=>`<label${w?' class=w':''}>${l}<input id=${id} type=${t} value="${esc(v)}"${t==='number'?' step=0.01 min=0 inputmode=decimal':''}></label>`,
sel=(l,id,o,v,w)=>`<label${w?' class=w':''}>${l}<select id=${id}>${o.map(x=>`<option${x===v?' selected':''}>${x}`).join('')}</select></label>`;

function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',3500)}

// Sincronização com o Google Sheets via Apps Script
async function syncPost(sheet, action, data) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sheet, action, data })
    });
  } catch(e) { console.error(e); }
}

async function put(sheet, id, data) {
  if(sheet === 's') S.s[id] = data;
  else if(sheet === 'c') S.c[id] = data;
  else if(sheet === 'h') {
    const idx = H.e.findIndex(x => x.id === id);
    if(idx >= 0) H.e[idx] = data; else H.e.push(data);
  }
  else if(sheet === 'comp') {
    const idx = H.c.findIndex(x => x.id === id);
    if(idx >= 0) H.c[idx] = data; else H.c.push(data);
  }
  
  const targetSheet = sheet === 's' ? 'Servicos' : sheet === 'c' ? 'Custos' : sheet === 'h' ? 'Horas' : 'Empresas';
  toast('Salvando na planilha...');
  await syncPost(targetSheet, 'save', { id, ...data });
  toast('Salvo com sucesso!');
}

async function rm(sheet, id) {
  if(sheet === 'sc') { delete S.s[id]; delete S.c[id]; await syncPost('Servicos', 'delete', {id}); await syncPost('Custos', 'delete', {id}); }
  else if(sheet === 'h') { H.e = H.e.filter(e => e.id !== id); await syncPost('Horas', 'delete', {id}); }
  else if(sheet === 'comp') { H.c = H.c.filter(c => c.id !== id); await syncPost('Empresas', 'delete', {id}); }
  render();
  toast('Excluído.');
}

const HL='gestao-horas-v1',NL=String.fromCharCode(10);
let H=(()=>{try{const j=JSON.parse(localStorage.getItem(HL));if(j&&j.c&&j.e)return j}catch(e){}return{c:[],e:[]}})(),hv='lan',hid=null,hcid=null,HF={},HT='',HW='';
const hg=(k,d)=>HF[k]!==undefined?HF[k]:d,hco=id=>H.c.find(c=>c.id===id),r2=n=>Math.round(n*100)/100,
hmin=(a,b)=>{if(!a||!b)return 0;const f=t=>{const p=t.split(':');return p[0]*60+ +p[1]},d=f(b)-f(a);return d<0?d+1440:d},
hh=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'),hdm=d=>d?String(d).split('T')[0].slice(8)+'/'+String(d).split('T')[0].slice(5,7):'',hkm=n=>String(n||0).replace('.',','),
hcalc=e=>{const m=hmin(e.i,e.o),h=r2(m/60*e.vh),l=r2(e.km*e.vk);return{m,h,l,t:r2(h+l)}},
hform=()=>{const c=hco(hg('e'))||H.c[0]||{};return{c:c.id||'',d:hg('d',hoje()),vh:+hg('vh',c.vh||'0'),i:hg('i',''),o:hg('o',''),km:+hg('km','')||0,vk:+hg('vk',c.vk||'0')}},
hrows=x=>`<div><span>Horas trabalhadas</span><b>${hh(x.m)}</b></div><div><span>Valor das horas</span><span>${R(x.h)}</span></div><div><span>Logística</span><span>${R(x.l)}</span></div><div class=tt><span>Total</span><span>${R(x.t)}</span></div>`,
hopt=id=>H.c.map(x=>`<option value=${x.id}${x.id===id?' selected':''}>${esc(x.n)}`).join(''),
hclr=(...k)=>k.forEach(x=>delete HF[x]);

function hlan(){
if(!H.c.length)return `<div class='cd em'>Cadastre uma empresa na aba Empresas para começar a lançar horas.<p><button class=bt data-a=nav data-i=emp>Cadastrar empresa</button></p></div>`;
const f=hform(),c=hco(f.c),ed=!!hid;
return `<div class=cd><h3>${ed?'Editar lançamento':'Novo lançamento'}</h3><div class=f><label class=w>Empresa<select id=h_e>${hopt(f.c)}</select></label>`+fld('Data','h_d',f.d,'date')+fld('Valor da hora (R$)','h_vh',hg('vh',c.vh||''),'number')+fld('Entrada','h_i',f.i,'time')+fld('Saída','h_o',f.o,'time')+fld('Km rodado até o cliente final','h_km',hg('km',''),'number')+fld('Valor do km (R$)','h_vk',hg('vk',c.vk||''),'number')+`</div><div class=sm id=h_sum style='margin-top:12px'>${hrows(hcalc(f))}</div><div class=ac><span style='flex:1'></span>${ed?`<button class=g data-a=cancel>Cancelar edição</button>`:''}<button class=bt data-a=save>${ed?'Salvar alterações':'Salvar lançamento'}</button></div></div>`}

function hrel(){
const c=hco(hg('re'))||H.c[0];
if(!c)return `<div class='cd em'>Cadastre uma empresa para ver a relação de horas.</div>`;
const a=hg('de',hoje().slice(0,8)+'01'),b=hg('ate',hoje()),L=H.e.filter(e=>e.c===c.id&&(!a||e.d>=a)&&(!b||e.d<=b)).sort((x,y)=>(x.d+x.i).localeCompare(y.d+y.i)),T={m:0,h:0,l:0,t:0};
L.forEach(e=>{const x=hcalc(e);T.m+=x.m;T.h+=x.h;T.l+=x.l;T.t+=x.t});
HT=L.length?[(c.ct?'Olá, '+c.ct+'!':''),'*ANF instalações elétricas*','Relação de horas – '+c.n,'Período: '+(a?fd(a):'—')+' a '+(b?fd(b):'—'),'',...L.map(e=>{const x=hcalc(e);return hdm(e.d)+': '+e.i+' às '+e.o+' ('+hh(x.m)+') = '+R(x.h)+(x.l?' + logística '+hkm(e.km)+' km = '+R(x.l):'')}),'','Horas trabalhadas: '+hh(T.m)+' ('+R(T.h)+')','Logística: '+R(T.l),'*Total: '+R(T.t)+'*'].filter((v,i)=>i||v).join(NL):'';
let z=(c.z||'').replace(/[^0-9]/g,'').replace(/^0+/,'');if(z&&z.length<=11)z='55'+z;
HW='https://wa.me/'+z+'?text='+encodeURIComponent(HT).replace(/'/g,'%27');
return `<div class=cd><div class=f><label class=w>Empresa<select id=h_re>${hopt(c.id)}</select></label>`+fld('De','h_de',a,'date')+fld('Até','h_ate',b,'date')+`</div></div><div class=cd><h3>Relação de horas</h3>`+tbl(['Data','Horário','Horas','Valor das horas','Logística','Total',''],L.map(e=>{const x=hcalc(e);return tr(fd(e.d),e.i+' às '+e.o,hh(x.m),R(x.h),x.l?R(x.l)+`<small>${hkm(e.km)} km</small>`:'—',`<b>${R(x.t)}</b>`,`<button class=g data-a=ed data-i=${e.id}>Editar</button> <button class=g data-a=del data-i=${e.id}>Apagar</button>`)}),'Nenhum lançamento neste período.')+(L.length?`<div class=sm style='margin-top:12px'>${hrows(T)}</div><div class=tb style='margin-top:12px'><a class=wz target=_blank rel=noopener href='${HW}'>Enviar no WhatsApp</a><button class=g data-a=copy>Copiar texto</button></div><pre class=rt>${esc(HT)}</pre>`:'')+`</div>`}

function hemp(){
const e=!!hcid;
return `<div class=cd><h3>${e?'Editar empresa':'Nova empresa'}</h3><div class=f>`+fld('Empresa','h_n',hg('n',''),'text',1)+fld('Nome do contato','h_ct',hg('ct',''))+fld('WhatsApp (com DDD)','h_z',hg('z',''),'tel')+fld('Valor da hora (R$)','h_cvh',hg('cvh',''),'number')+fld('Valor do km (R$)','h_cvk',hg('cvk',''),'number')+`</div><div class=ac><span style='flex:1'></span>${e?`<button class=g data-a=ccancel>Cancelar edição</button>`:''}<button class=bt data-a=csave>${e?'Salvar alterações':'Salvar empresa'}</button></div></div><div class=cd><h3>Empresas cadastradas</h3>`+tbl(['Empresa','WhatsApp','Hora','Km',''],H.c.map(c=>tr(esc(c.n)+(c.ct?`<small>${esc(c.ct)}</small>`:''),esc(c.z||'—'),R(c.vh),R(c.vk),`<button class=g data-a=ced data-i=${c.id}>Editar</button> <button class=g data-a=cdel data-i=${c.id}>Apagar</button>`)),'Nenhuma empresa cadastrada ainda.')+`</div>`}

const hrv=()=>`<div class=sn>${[['lan','Lançar'],['rel','Relação'],['emp','Empresas']].map(([k,l])=>`<button class='g${hv===k?' on':''}' data-a=nav data-i=${k}>${l}</button>`).join('')}</div>`+(hv==='lan'?hlan():hv==='rel'?hrel():hemp());

async function hact(b){const a=b.dataset.a,id=b.dataset.i;
if(a==='nav'){hv=id;render();return}
if(a==='copy'){try{await navigator.clipboard.writeText(HT);toast('Texto copiado.')}catch(e){}return}
if(a==='cancel'){hid=null;hclr('d','vh','vk','i','o','km');render();return}
if(a==='ccancel'){hcid=null;hclr('n','ct','z','cvh','cvk');render();return}
if(a==='ed'){const x=H.e.find(e=>e.id===id);if(!x)return;hid=id;Object.assign(HF,{e:x.c,d:x.d,vh:x.vh,i:x.i,o:x.o,km:x.km||'',vk:x.vk});hv='lan';render();scrollTo(0,0);return}
if(a==='ced'){const c=hco(id);if(!c)return;hcid=id;Object.assign(HF,{n:c.n,ct:c.ct||'',z:c.z||'',cvh:c.vh||'',cvk:c.vk||''});render();scrollTo(0,0);return}
if(a==='del'||a==='cdel'){if(!b.dataset.r){b.dataset.r=1;b.textContent='Confirmar?';setTimeout(()=>{b.dataset.r='';b.textContent='Apagar'},3000);return}
if(a==='del') rm('h', id); else { rm('comp', id); H.c = H.c.filter(c=>c.id!==id); H.e = H.e.filter(e=>e.c!==id); }
render();return}
if(a==='save'){const v=hform();if(!v.c)return toast('Cadastre uma empresa primeiro.');if(!v.i||!v.o)return toast('Preencha entrada e saída.');
const id=hid||'h'+Date.now().toString(36);
const entry = {id, c:v.c, d:v.d, vh:v.vh, i:v.i, o:v.o, km:v.km, vk:v.vk};
await put('h', id, entry);
hid=null; hclr('i','o','km','d'); render(); toast('Salvo.'); return}
if(a==='csave'){const n=hg('n','').trim();if(!n)return toast('Informe o nome da empresa.');
const id=hcid||'comp'+Date.now().toString(36);
const comp = {id, n, ct:hg('ct','').trim(), z:hg('z','').trim(), vh:+hg('cvh','')||0, vk:+hg('cvk','')||0};
await put('comp', id, comp);
hcid=null; hclr('n','ct','z','cvh','cvk'); render(); toast('Empresa salva.'); return}
}

$('#mn').addEventListener('click',ev=>{const b=ev.target.closest('button[data-a]');if(b)hact(b)});
$('#mn').addEventListener('input',ev=>{const t=ev.target,k=t.id&&t.id.indexOf('h_')===0?t.id.slice(2):'';if(!k)return;HF[k]=t.value;if(k==='e'){hclr('vh','vk');render()}else if(k==='re'||k==='de'||k==='ate')render();else if(hv==='lan'&&$('#h_sum'))$('#h_sum').innerHTML=hrows(hcalc(hform()))});

async function init(){
  try {
    toast('Carregando dados da planilha...');
    const res = await fetch(API_URL);
    const data = await res.json();
    if(data.Servicos) data.Servicos.forEach(x => S.s[x.id] = x);
    if(data.Custos) data.Custos.forEach(x => S.c[x.id] = x);
    if(data.Horas) H.e = data.Horas;
    if(data.Empresas) H.c = data.Empresas;
    toast('Dados carregados!');
  } catch(e) {
    toast('Modo offline / erro ao carregar.');
  }
  render();
}

function apply(){const c=S.cfg,r=document.documentElement.style;r.setProperty('--c1',c.c1);r.setProperty('--c2',c.c2);r.setProperty('--on1',on(c.c1));$('#nm').textContent=c.nome;document.title=c.nome;const l=$('#lg');l.hidden=!c.logo;if(c.logo)l.src=c.logo}
function render(){apply();
 $('#nv').innerHTML=[['dash','Painel'],['srv','Serviços'],['cus','Custos'],['hor','Horas'],['cfg','Configurações']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
 const v={dash,srv:lsS,cus:lsC,hor:hrv,cfg}[tab]();
 $('#mn').innerHTML=(tab==='cfg'||tab==='hor'?'':bar())+v;
 if(tab==='dash')charts()}

function bar(){
 const m=[...new Set([...Object.values(S.s),...Object.values(S.c)].map(x=>x.data?x.data.slice(0,7):'').concat(hoje().slice(0,7)))].filter(Boolean).sort().reverse(),
 b=tab==='srv'?'<button class=bt onclick="openS()">Novo serviço</button>':tab==='cus'?'<button class=bt onclick="openC()">Novo custo</button>':'';
 return '<div class=tb><select aria-label="Período" onchange="per=this.value;render()"><option value=all>Todo o período'+m.map(x=>`<option value=${x}${per===x?' selected':''}>${new Date(x+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}`).join('')+'</select><span style="flex:1"></span><button class=g onclick="xl()">Exportar Excel</button>'+b+'</div>'}

function calc(){const sv=SV(),cu=CU(),dn=sv.filter(x=>x.situacao===STS[2]||x.st===STS[2]),kmv=+S.cfg.kmv||0,
 fat=sum(dn,'valor'),km=sum(dn,'km'),kmc=km*kmv,cus=sum(cu,'valor')+kmc,luc=fat-cus;
 return{sv,cu,dn,fat,km,kmc,cus,luc,mar:fat?luc/fat*100:0,nd:dn.length,tm:dn.length?fat/dn.length:0,rec:sum(dn.filter(x=>!x.pago),'valor'),abe:sum(sv.filter(x=>(x.situacao||x.st)!==STS[2]),'valor'),lt:dn.filter(x=>!x.pago&&x.prazo&&x.prazo<hoje())}}

function dash(){const k=calc(),
 tip=TIP.map(t=>{const a=k.dn.filter(x=>x.tipo===t),f=sum(a,'valor'),m=sum(a,'km');return tr(t,a.length,R(f),R(a.length?f/a.length:0),N(m)+' km',m?R(f/m):'—')}),
 ori=ORI.map(o=>{const a=k.sv.filter(x=>x.origem===o||x.ori===o);if(!a.length)return'';const f=sum(a.filter(x=>(x.situacao||x.st)===STS[2]),'valor'),i=MAPA[o]?sum(k.cu.filter(x=>x.cat===MAPA[o]),'valor'):0;return tr(o,new Set(a.map(x=>(x.cliente||x.cli||'').trim().toLowerCase())).size,R(f),i?R(i):'—',i?N((f-i)/i*100)+'%':'—')}).filter(Boolean),g={};
 k.dn.forEach(x=>{const n=(x.cliente||x.cli||'').trim(),y=g[n]=g[n]||{n,t:x.tipo,q:0,f:0,m:0};y.q++;y.f+=+x.valor||0;y.m+=+x.km||0});
 const top=Object.values(g).sort((a,b)=>b.f-a.f).slice(0,5).map(x=>tr(esc(x.n),x.t,x.q,N(x.m)+' km',R(x.f)));
 const fp=FP.map(f=>{const a=k.dn.filter(x=>x.pago&&x.forma===f);return a.length?tr(f,a.length,R(sum(a,'valor'))):''}).filter(Boolean),
 rc=k.dn.filter(x=>!x.pago).sort((a,b)=>(a.prazo||'9').localeCompare(b.prazo||'9')).slice(0,8).map(x=>tr(esc(x.cliente||x.cli),x.prazo?fd(x.prazo):'sem prazo',x.prazo&&x.prazo<hoje()?'<span class="b er">Atrasado</span>':'<span class="b wa">A receber</span>',R(x.valor)));
 return `<div class=kp><div class="k hero"><span>Lucro líquido</span><b>${R(k.luc)}</b><small>Margem de ${N(k.mar)}% sobre o faturamento</small></div>${kpi('Faturamento',R(k.fat),k.nd+' serviços concluídos')}${kpi('Custos',R(k.cus),k.kmc?'inclui '+R(k.kmc)+' de km':'lançados no período')}${kpi('A receber',R(k.rec),'concluídos e não pagos')}${kpi('Em atraso',R(sum(k.lt,'valor')),k.lt.length+' vencidos')}${kpi('Em aberto',R(k.abe),'orçamentos e agendados')}${kpi('Ticket médio',R(k.tm),'por concluído')}${kpi('Km rodados',N(k.km)+' km','')}</div>
 <div class=gr><div class=cd><h3>Últimos 6 meses</h3><div class=cv><canvas id=g1></canvas></div></div><div class=cd><h3>Custos por categoria</h3><div class=cv><canvas id=g2></canvas></div></div></div>
 <div class=gr><div class=cd><h3>Contas a receber</h3>${tbl(['Cliente','Prazo','Situação','Valor'],rc,'Nada pendente.')}</div><div class=cd><h3>Formas de pagamento</h3>${tbl(['Forma','Pagamentos','Total'],fp,'Nenhum pagamento registrado.')}</div></div>
 <div class=cd><h3>Terceirizado e Cliente final</h3>${tbl(['Tipo','Serviços','Faturamento','Ticket médio','Km','Por km'],tip,'')}</div>
 <div class=cd><h3>Origem dos clientes</h3>${tbl(['Origem','Clientes','Faturamento','Investido','Retorno'],ori,'Sem serviços.')}</div>
 <div class=cd><h3>Maiores clientes</h3>${tbl(['Cliente','Tipo','Serviços','Km','Faturamento'],top,'Sem dados.')}</div>`}

function charts(){ch.forEach(c=>c.destroy());ch=[];if(!window.Chart)return;
 const k=calc(),ln=css('--ln'),c1=css('--c1'),c2=css('--c2'),kv=+S.cfg.kmv||0,ms=[],d=new Date();
 Chart.defaults.color=css('--mu');
 for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}
 const all=Object.values(S.s).filter(x=>(x.situacao||x.st)===STS[2]),
 rev=ms.map(m=>sum(all.filter(x=>x.data&&x.data.startsWith(m)),'valor')),
 cst=ms.map(m=>sum(Object.values(S.c).filter(x=>x.data&&x.data.startsWith(m)),'valor')+sum(all.filter(x=>x.data&&x.data.startsWith(m)),'km')*kv),
 tip={callbacks:{label:c=>(c.dataset.label||c.label)+': '+R(c.raw)}};
 ch.push(new Chart($('#g1'),{type:'bar',data:{labels:ms.map(m=>new Date(m+'-15').toLocaleDateString('pt-BR',{month:'short'})),datasets:[{label:'Faturamento',data:rev,backgroundColor:c1},{label:'Custos',data:cst,backgroundColor:css('--wa')},{label:'Lucro',data:rev.map((v,i)=>v-cst[i]),backgroundColor:css('--ok')}]},options:{maintainAspectRatio:false,scales:{y:{grid:{color:ln},ticks:{callback:v=>R(v)}},x:{grid:{display:false}}},plugins:{tooltip:tip}}}));
 const lb=[...CAT],vl=CAT.map(c=>sum(k.cu.filter(x=>x.cat===c),'valor'));if(k.kmc){lb.push('Km rodados');vl.push(k.kmc)}
 const ix=vl.map((v,i)=>i).filter(i=>vl[i]>0);
 ch.push(new Chart($('#g2'),{type:'doughnut',data:{labels:ix.map(i=>lb[i]),datasets:[{data:ix.map(i=>vl[i]),backgroundColor:ix.map(i=>[c1,c2,...pal.slice(2)][i%pal.length]),borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right'},tooltip:tip}}}))}

const rowsS=()=>SV().filter(x=>(!ft||x.tipo===ft)&&(!q||((x.cliente||x.cli||'')+' '+(x.servico||x.srv||'')).toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
function bodyS(){const a=rowsS();return a.length?`<p class=mu>${a.length} serviços, ${R(sum(a,'valor'))} cobrados, ${N(sum(a,'km'))} km</p><div class=tw><table><tr><th>Data<th>Cliente<th>Tipo<th>Origem<th class=n>Km<th class=n>Valor<th>Situação<th></tr>${a.map(x=>`<tr><td>${fd(x.data)}<td>${esc(x.cliente||x.cli)}<small>${esc(x.servico||x.srv)}</small><td><span class="b${x.tipo===TIP[1]?' t':''}">${x.tipo}</span><td>${x.origem||x.ori}<td class=n>${N(x.km)} km<td class=n>${R(x.valor)}<td>${x.situacao||x.st}${((x.situacao||x.st)===STS[2])?pg(x):''}<td><button class=g onclick="openS('${x.id}')">Editar</button></tr>`).join('')}</table></div>`:'<p class=em>Nenhum serviço encontrado.</p>'}
function lsS(){return `<div class=cd><div class=tb><input style="flex:1;min-width:160px" placeholder="Buscar..." value="${esc(q)}" oninput="q=this.value;$('#ls').innerHTML=bodyS()"><select onchange="ft=this.value;$('#ls').innerHTML=bodyS()"><option value="">Todos os tipos${TIP.map(t=>`<option${ft===t?' selected':''}>${t}`).join('')}</select></div><div id=ls>${bodyS()}</div></div>`}
function lsC(){const a=CU().sort((x,y)=>(y.data||'').localeCompare(x.data||'')),k=calc();
 return `<div class=cd><p class=mu>${a.length} lançamentos, total de ${R(sum(a,'valor'))}</p>`+(a.length?`<div class=tw><table><tr><th>Data<th>Categoria<th>Descrição<th class=n>Valor<th></tr>${a.map(x=>`<tr><td>${fd(x.data)}<td>${x.cat}<td>${esc(x.descricao||x.desc)}<td class=n>${R(x.valor)}<td><button class=g onclick="openC('${x.id}')">Editar</button></tr>`).join('')}</table></div>`:'<p class=em>Nenhum custo.</p>')+'</div>'}

function modal(t,h,save,id){armed=0;$('#dl').innerHTML=`<h3 style="margin:0 0 14px">${t}</h3><div class=f>${h}</div><div class=ac>${id?`<button class=g id=xd onclick="exc('${id}')">Excluir</button>`:''}<span style="flex:1"></span><button class=g onclick="$('#dl').close()">Cancelar</button><button class=bt onclick="${save}">Salvar</button></div>`;$('#dl').showModal()}

function openS(id){const x=id?S.s[id]:{data:hoje(),tipo:TIP[0],cliente:'',servico:'',origem:ORI[0],km:'',valor:'',situacao:STS[2],pago:false};ed=id||null;
 modal(id?'Editar serviço':'Novo serviço',fld('Data','f_d',x.data,'date')+sel('Tipo','f_t',TIP,x.tipo)+fld('Cliente','f_c',x.cliente||x.cli,'text',1)+fld('Serviço','f_s',x.servico||x.srv,'text',1)+sel('Origem','f_o',ORI,x.origem||x.origem,1)+fld('Km','f_k',x.km,'number')+fld('Valor (R$)','f_v',x.valor,'number')+sel('Situação','f_st',STS,x.situacao||x.st,1)+`<label class="ck w"><input type=checkbox id=f_p${x.pago?' checked':''}> Pago</label>`+fld('Prazo','f_pz',x.prazo||'','date')+sel('Forma','f_fp',['Não informada',...FP],x.forma||'Não informada'),'saveS()',id)}

async function saveS(){const c=$('#f_c').value.trim();if(!c)return toast('Informe o cliente.');
const id=ed||'s'+Date.now().toString(36);
const d={id, data:$('#f_d').value||hoje(), tipo:$('#f_t').value, cliente:c, servico:$('#f_s').value.trim(), origem:$('#f_o').value, km:+$('#f_k').value||0, valor:+$('#f_v').value||0, situacao:$('#f_st').value, pago:$('#f_p').checked, prazo:$('#f_pz').value, forma:$('#f_fp').value==='Não informada'?'':$('#f_fp').value};
$('#dl').close(); await put('s', id, d); render();}

function openC(id){const x=id?S.c[id]:{data:hoje(),cat:CAT[0],descricao:'',valor:''};ed=id||null;
 modal(id?'Editar custo':'Novo custo',fld('Data','f_d',x.data,'date')+sel('Categoria','f_k',CAT,x.cat)+fld('Descrição','f_s',x.descricao||x.desc,'text',1)+fld('Valor (R$)','f_v',x.valor,'number',1),'saveC()',id)}

async function saveC(){const v=+$('#f_v').value;if(!v)return toast('Informe o valor.');
const id=ed||'c'+Date.now().toString(36);
const d={id, data:$('#f_d').value||hoje(), cat:$('#f_k').value, descricao:$('#f_s').value.trim(), valor:v};
$('#dl').close(); await put('c', id, d); render();}

async function exc(id){const b=$('#xd');if(!armed){armed=1;b.textContent='Confirmar';b.classList.add('red');return}await rm('sc', id);$('#dl').close();}

function toggleTheme(){document.documentElement.classList.toggle('dark')}

async function xl(){
 try{
  const sv=Object.values(S.s),cu=Object.values(S.c),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sv),'Servicos');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cu),'Custos');
  XLSX.writeFile(wb, 'gestao.xlsx');
  toast('Exportado!');
 }catch(e){toast('Erro ao exportar.');}
}

function cfg(){return `<div class=cd><h3>Configurações e Sincronização</h3><p class=mu>Conectado ao Google Sheets com sucesso via Apps Script.</p><button class=bt onclick="init()">Atualizar dados da planilha</button></div>`}

// PWA Service Worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
let dp; window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#pwa-install-banner').classList.remove('hidden')});
$('#btn-install')?.addEventListener('click',async()=>{if(dp){dp.prompt();dp=null;$('#pwa-install-banner').classList.add('hidden')}});

init();
</script>
